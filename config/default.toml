# Codegen fixes for default.xex (Skylanders Giants, Xbox 360).
# Keys use the same schema as the manifest's [entrypoint] table.
# Every entry needs a comment: what is at the address and how it was found.

# Jump table for the bit-stream decoder in sub_821658B8. The index is built from masked bits with
# no bounds check (r7 = bits & 7 for 0..6, (bits & 3) + 7 for 7..10), so codegen guessed 4 entries and
# the generated switch trapped at runtime. The table at 0x821659A8 has exactly 11 entries.
[[switch_tables]]
address = 0x821659A4
register = 7
labels = [0x821659D4, 0x821659F4, 0x82165B90, 0x82165D2C, 0x82165EC8, 0x82166064, 0x82166200, 0x8216639C, 0x82166538, 0x82166720, 0x82166908]

# Jump table at 0x82166BEC was detected with 8 entries; it has 11 (found by reading the table until a
# non-code word). The index has no bounds check the analyzer could use, so the generated switch trapped.
[[switch_tables]]
address = 0x82166BE8
register = 19
labels = [0x82166C18, 0x82166C40, 0x82166E24, 0x82167008, 0x821671EC, 0x821673D0, 0x821675B4, 0x82167798, 0x8216797C, 0x82167BAC, 0x82167DDC]

# Jump table at 0x8216AA08 was detected with 4 entries; it has 11 (found by reading the table until a
# non-code word). The index has no bounds check the analyzer could use, so the generated switch trapped.
[[switch_tables]]
address = 0x8216AA04
register = 10
labels = [0x8216AA34, 0x8216AA48, 0x8216AA98, 0x8216AAE8, 0x8216AB38, 0x8216AB88, 0x8216ABD0, 0x8216AC20, 0x8216AC70, 0x8216ACEC, 0x8216AD68]

# Jump table at 0x821693D4 was detected with 8 entries; it has 11 (found by reading the table until a
# non-code word). The index has no bounds check the analyzer could use, so the generated switch trapped.
[[switch_tables]]
address = 0x821693D0
register = 20
labels = [0x82169400, 0x82169410, 0x82169598, 0x82169720, 0x821698A8, 0x82169A30, 0x82169BB8, 0x82169D40, 0x82169EC8, 0x8216A074, 0x8216A220]

